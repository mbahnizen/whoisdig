<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879A8"/>
      <stop offset="45%" stop-color="#C06CC8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" ry="108" fill="url(#glow)"/>

  <g transform="translate(256,256)">
    <!-- Globe — outer ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="white" stroke-width="12" opacity="0.95"/>

    <!-- Meridian (vertical ellipse) -->
    <ellipse cx="0" cy="0" rx="48" ry="120" fill="none" stroke="white" stroke-width="9" opacity="0.55"/>

    <!-- Equator -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="white" stroke-width="9" opacity="0.55" stroke-linecap="round"/>

    <!-- Latitude arcs -->
    <ellipse cx="0" cy="-56" rx="104" ry="16" fill="none" stroke="white" stroke-width="7" opacity="0.3"/>
    <ellipse cx="0" cy="56" rx="104" ry="16" fill="none" stroke="white" stroke-width="7" opacity="0.3"/>

    <!-- Cursor / Arrow (the "dig" symbol) — pointing upper-left -->
    <g transform="translate(-10,-10) rotate(0)">
      <!-- Arrow head -->
      <polygon points="-8,-8 -70,-70 -28,-52 -52,-28" fill="white" opacity="0.95"/>
      <!-- Search line / shaft -->
      <line x1="-8" y1="-8" x2="52" y2="52" stroke="white" stroke-width="15" stroke-linecap="round" opacity="0.95"/>
      <!-- Magnifier circle -->
      <circle cx="65" cy="65" r="22" fill="none" stroke="white" stroke-width="11" opacity="0.85"/>
    </g>
  </g>
</svg>
