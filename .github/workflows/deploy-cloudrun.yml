name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # GCP Project ID (stored in GitHub Secrets)
  REGION: asia-southeast2 # Cloud Run Region (e.g., Jakarta: asia-southeast2, Singapore: asia-southeast1)
  SERVICE_NAME: whoisdig # Cloud Run service name
  GAR_LOCATION: asia-southeast2 # Artifact Registry location
  GAR_REPOSITORY: whoisdig-repo # Artifact Registry repository name

jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Google Cloud Authentication ─────────────────────────────────────────
      # Option A: Workload Identity Federation (Recommended)
      # Set secrets.GCP_WIF_PROVIDER and secrets.GCP_WIF_SERVICE_ACCOUNT in GitHub.
      #
      # Option B: Service Account Key JSON
      # Set secrets.GCP_SA_KEY with the JSON key content in GitHub.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }} # Optional: Use WIF
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }} # Optional: Use WIF
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Optional: Use SA Key (Fallback)

      # ── Login to Artifact Registry ──────────────────────────────────────────
      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # ── Build and Push Docker Image ─────────────────────────────────────────
      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"
          
          # Build using Docker with multi-tag support
          docker build -t $IMAGE_TAG -t $LATEST_TAG .
          
          # Push both specific SHA tag and latest tag
          docker push $IMAGE_TAG
          docker push $LATEST_TAG
          
          # Output the image tag for the next step
          echo "IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      # ── Deploy to Google Cloud Run ──────────────────────────────────────────
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=5
