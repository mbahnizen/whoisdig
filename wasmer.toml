[package]
name = "belajarnizen/whoisdig"
version = "0.1.0"
description = "Domain & DNS Intelligence Tool — WHOIS, RDAP, DNS Lookup"
license = "MIT"
private = true

[dependencies]
"php/php" = "*"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
